<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Employee Leave Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>Employee Profile</h1>

    <form method="POST">

        <label>Name</label><br>
        <input type="text"
               name="name"
               value="{{ employee[0] }}"
               required>

        <br><br>

        <label>Email</label><br>
        <input type="email"
               name="email"
               value="{{ employee[1] }}"
               required>

        <br><br>

        <label>Department</label><br>
        <input type="text"
               name="department"
               value="{{ employee[2] }}"
               required>

        <br><br>

        <button type="submit">
            Update Profile
        </button>

    </form>

    <br>

    <a href="/dashboard">
        <button>Back to Dashboard</button>
    </a>

</div>

</body>

</html>
