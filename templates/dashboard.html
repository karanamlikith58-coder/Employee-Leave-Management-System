<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Employee Leave Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>Welcome {{ name }} 👋</h1>

    <h3>Employee Dashboard</h3>

    <hr>

    <div class="cards">

        <div class="card">
            <h2>{{ total }}</h2>
            <p>Total Leaves</p>
        </div>

        <div class="card">
            <h2>{{ pending }}</h2>
            <p>Pending</p>
        </div>

        <div class="card">
            <h2>{{ approved }}</h2>
            <p>Approved</p>
        </div>

        <div class="card">
            <h2>{{ rejected }}</h2>
            <p>Rejected</p>
        </div>

    </div>

    <br><br>

    <a href="/apply_leave">
        <button>Apply Leave</button>
    </a>

    <a href="/leave_history">
        <button>Leave History</button>
    </a>

    <a href="/profile">
        <button>Profile</button>
    </a>

    <a href="/logout">
        <button>Logout</button>
    </a>

</div>

</body>

</html>
